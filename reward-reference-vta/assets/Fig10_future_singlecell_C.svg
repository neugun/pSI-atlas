   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Arial'; text-anchor: start; fill: #111111" x="24.12" y="27.969035" transform="rotate(-0 24.12 27.969035)">Function → molecule → projection → causal test</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #4f5966" transform="translate(24.12 40.19336)">The final question is whether Reward Contrast is a cell class or a</text>
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #4f5966" transform="translate(24.12 47.267823)">distributed manifold.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 6px; font-family: 'Arial'; fill: #111111" transform="translate(8.538094 83.913539)">Longitudinal</text>
    <text style="font-weight: 700; font-size: 6px; font-family: 'Arial'; fill: #111111" transform="translate(14.703094 90.44393)">function</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6px; font-family: 'Arial'; fill: #111111" transform="translate(61.102781 83.91348)">Cross-day</text>
    <text style="font-size: 6px; font-family: 'Arial'; fill: #111111" transform="translate(59.932781 90.443871)">registration</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6px; font-family: 'Arial'; fill: #111111" transform="translate(108.582938 83.913539)">~100-gene</text>
    <text style="font-size: 6px; font-family: 'Arial'; fill: #111111" transform="translate(108.508406 90.44393)">EASI/FISH</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6px; font-family: 'Arial'; fill: #111111" transform="translate(157.912313 83.91348)">Projection</text>
    <text style="font-size: 6px; font-family: 'Arial'; fill: #111111" transform="translate(161.747156 90.443871)">identity</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 6px; font-family: 'Arial'; fill: #111111" transform="translate(202.418813 83.913598)">Causal</text>
    <text style="font-weight: 700; font-size: 6px; font-family: 'Arial'; fill: #111111" transform="translate(206.921625 90.443871)">test</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'Arial'; fill: #111111" transform="translate(44.481336 145.080331)">Dedicated class</text>
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'Arial'; fill: #111111" transform="translate(42.444031 151.719442)">stable same cells</text>
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'Arial'; fill: #111111" transform="translate(33.213016 158.358554)">+ molecular enrichment</text>
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'Arial'; fill: #111111" transform="translate(32.879898 164.997665)">+ projection enrichment</text>
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'Arial'; fill: #111111" transform="translate(32.696422 171.636896)">+ selective causal effect</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'Arial'; fill: #111111" transform="translate(144.013234 148.399827)">Distributed manifold</text>
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'Arial'; fill: #111111" transform="translate(141.636141 155.038938)">stable population axis</text>
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'Arial'; fill: #111111" transform="translate(134.767922 161.67805)">+ rotating cell membership</text>
    <text style="font-weight: 700; font-size: 6.1px; font-family: 'Arial'; fill: #111111" transform="translate(130.18625 168.31728)">+ weak molecular segregation</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 6.2px; font-family: 'Arial'; text-anchor: middle; fill: #111111" x="120.6" y="205.02" transform="rotate(-0 120.6 205.02)">A causal double dissociation is the decisive endpoint.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #4f5966" transform="translate(2.896336 214.494129)">Functionally defined ensembles should be perturbed during history encoding vs current probe</text>
    <text style="font-size: 5.7px; font-family: 'Arial'; fill: #4f5966" transform="translate(106.871461 220.698)">separately.</text>
   </g>
  </g>
