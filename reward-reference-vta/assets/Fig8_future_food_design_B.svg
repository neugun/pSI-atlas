   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Arial'; fill: #111111" transform="translate(24.12 28.613615)">Same probe separates contrast</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Arial'; fill: #111111" transform="translate(24.12 37.973674)">from classical RPE</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #4f5966" transform="translate(24.12 54.66536)">Hold explicit expectation fixed while changing recent history.</text>
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #4f5966" transform="translate(24.12 61.73995)">Add catch outcomes for true prediction error.</text>
   </g>
   <g id="text_3">
