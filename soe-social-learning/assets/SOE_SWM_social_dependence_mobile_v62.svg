</style><rect width="1000" height="1000" fill="#fff"/><text x="50" y="62" class="title">SWM needs real social content</text><text x="50" y="98" class="sub">Two in-distribution controls test what the latent uses</text><rect x="50" y="150" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="192" class="panel">A</text><text x="78" y="230" class="ct" fill="#b9232f">Coherent trajectory replacement</text><text x="78" y="268" class="body">replace held-out social trajectory while preserving distribution</text><text x="78" y="302" class="body">relational-efficacy prediction drops in 26/27 animals</text><rect x="50" y="390" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="432" class="panel">B</text><text x="78" y="470" class="ct" fill="#b9232f">No-social retrain</text><text x="78" y="508" class="body">train the same model without social inputs</text><text x="78" y="542" class="body">efficacy drops in 26/27 animals</text><rect x="50" y="630" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="672" class="panel">C</text><text x="78" y="710" class="ct" fill="#173a5e">Meaning</text><text x="78" y="748" class="body">prospective efficacy depends on specific social content</text><text x="78" y="782" class="body">broad future dynamics are less affected</text><text x="50" y="972" class="foot">Tap to open the full quantitative figure</text></svg>