.title{font:700 38px Arial;fill:#173a5e}.sub{font:400 24px Arial;fill:#657286}.panel{font:700 24px Arial;fill:#162131}.ct{font:700 27px Arial}.body{font:400 22px Arial;fill:#52677a}.foot{font:400 20px Arial;fill:#7b8797}
</style><rect width="1000" height="1000" fill="#fff"/><text x="50" y="62" class="title">Rat strong-comparator test</text><text x="50" y="98" class="sub">Nested CV chooses the classical comparator inside training rats</text><rect x="50" y="150" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="192" class="panel">A</text><text x="78" y="230" class="ct" fill="#173a5e">Comparator selection</text><text x="78" y="268" class="body">WSLS / Q / asym-Q / forget-Q / CK / Q+CK compete inside each training fold</text><text x="78" y="302" class="body">CK is selected in all five outer folds</text><rect x="50" y="390" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="432" class="panel">B</text><text x="78" y="470" class="ct" fill="#b9232f">Held-rat test</text><text x="78" y="508" class="body">structured multiscale state improves Brier in 8/10 rats</text><text x="78" y="542" class="body">NLL 8/10; AUC 9/10</text><rect x="50" y="630" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="672" class="panel">C</text><text x="78" y="710" class="ct" fill="#173a5e">Meaning</text><text x="78" y="748" class="body">cross-task support survives a matched classical-family baseline</text><text x="78" y="782" class="body">inference unit is the held-out rat</text><text x="50" y="972" class="foot">Tap to open the full quantitative figure</text></svg>