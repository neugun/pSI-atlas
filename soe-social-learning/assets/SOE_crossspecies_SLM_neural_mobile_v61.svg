<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
<style>.title{font:700 38px Arial;fill:#173a5e}.sub{font:400 24px Arial;fill:#657286}.panel{font:700 24px Arial;fill:#162131}.ct{font:700 27px Arial}.body{font:400 22px Arial;fill:#52677a}.foot{font:400 20px Arial;fill:#7b8797}</style>
<rect width="1000" height="1000" fill="#fff"/><text x="50" y="62" class="title">Cross-species neural support</text><text x="50" y="98" class="sub">Neural convergence is kept separate from population-level replication</text><rect x="50" y="150" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="192" class="panel">A</text><text x="78" y="230" class="ct" fill="#555">Macaque</text><text x="78" y="268" class="body">social / nonsocial neural components track task variables</text><text x="78" y="302" class="body">sessions remain nested within only two monkeys</text><rect x="50" y="390" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="432" class="panel">B</text><text x="78" y="470" class="ct" fill="#173a5e">Task-aligned signatures</text><text x="78" y="508" class="body">policy / RPE-like / history-related signals recur across datasets</text><text x="78" y="542" class="body">evidence is convergent, not a pooled universal statistic</text><rect x="50" y="630" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="672" class="panel">C</text><text x="78" y="710" class="ct" fill="#173a5e">Inference boundary</text><text x="78" y="748" class="body">independent-subject / rat behavioral comparators carry stronger weight</text><text x="78" y="782" class="body">neural correspondences are labeled as convergence / analogue</text><text x="50" y="972" class="foot">Tap to open the full quantitative figure</text></svg>