</style><rect width="1000" height="1000" fill="#fff"/><text x="50" y="62" class="title">Matched cross-domain mapping</text><text x="50" y="98" class="sub">Different SOE computations forecast different later phenotypes</text><rect x="50" y="150" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="192" class="panel">A</text><text x="78" y="230" class="ct" fill="#b9232f">Credit → novel food</text><text x="78" y="268" class="body">social-credit maintenance maps to novel-food initiation</text><text x="78" y="302" class="body">fits the expected action-threshold function</text><rect x="50" y="390" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="432" class="panel">B</text><text x="78" y="470" class="ct" fill="#b9232f">APE → fear</text><text x="78" y="508" class="body">late |APE| maps to shock-locked reactivity</text><text x="78" y="542" class="body">fits an unexpected-event sensitivity function</text><rect x="50" y="630" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="672" class="panel">C</text><text x="78" y="710" class="ct" fill="#173a5e">Matched &gt; mismatched</text><text x="78" y="748" class="body">the two prespecified links exceed the off-diagonal mapping</text><text x="78" y="782" class="body">exact P=.00672</text><text x="50" y="972" class="foot">Tap to open the full quantitative figure</text></svg>