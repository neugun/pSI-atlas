<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><style>
.title{font:700 38px Arial;fill:#173a5e}.sub{font:400 24px Arial;fill:#657286}.panel{font:700 24px Arial;fill:#162131}.ct{font:700 27px Arial}.body{font:400 22px Arial;fill:#52677a}.foot{font:400 20px Arial;fill:#7b8797}
</style><rect width="1000" height="1000" fill="#fff"/><text x="50" y="62" class="title">Why the default SLM is needed</text><text x="50" y="98" class="sub">Move from weak baselines to compact mechanistic state</text><rect x="50" y="140" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="182" class="panel">A</text><text x="78" y="220" class="ct" fill="#555">Weak baselines</text><text x="78" y="258" class="body">prevalence / clock / previous choice / current state</text><text x="78" y="292" class="body">leave substantial held-animal error</text><rect x="520" y="140" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="548" y="182" class="panel">B</text><text x="548" y="220" class="ct" fill="#173a5e">Classical RL</text><text x="548" y="258" class="body">Q / choice-kernel families improve prediction</text><text x="548" y="292" class="body">still miss the full social-learning structure</text><rect x="50" y="500" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="542" class="panel">C</text><text x="78" y="580" class="ct" fill="#b9232f">Default SLM</text><text x="78" y="618" class="body">mechanistic SLM + generic choice persistence</text><text x="78" y="652" class="body">best compact behavioral model</text><rect x="520" y="500" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="548" y="542" class="panel">D</text><text x="548" y="580" class="ct" fill="#173a5e">Capacity audit</text><text x="548" y="618" class="body">TinyRNN / History MLP test flexible capacity</text><text x="548" y="652" class="body">they do not define the biological interpretation</text><text x="50" y="972" class="foot">Tap to open the full quantitative figure</text></svg>