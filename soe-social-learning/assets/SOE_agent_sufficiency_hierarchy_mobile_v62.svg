</style><rect width="1000" height="1000" fill="#fff"/><text x="50" y="62" class="title">Where the generative SLM helps</text><text x="50" y="98" class="sub">Run the fitted controllers forward in the same social-foraging world</text><rect x="50" y="140" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="182" class="panel">A</text><text x="78" y="220" class="ct" fill="#555">Global trajectory</text><text x="78" y="258" class="body">Full SLM has highest correlation</text><text x="78" y="292" class="body">Q has slightly lower RMSE</text><rect x="520" y="140" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="548" y="182" class="panel">B</text><text x="548" y="220" class="ct" fill="#b9232f">Local strategy</text><text x="548" y="258" class="body">Full SLM best matches outcome-conditioned social kernel</text><text x="548" y="292" class="body">clearest generative advantage</text><rect x="50" y="500" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="542" class="panel">C</text><text x="78" y="580" class="ct" fill="#173a5e">Motif occupancy</text><text x="78" y="618" class="body">Full SLM improves state occupancy vs Q / belief</text><text x="78" y="652" class="body">paired animal-level support</text><rect x="520" y="500" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="548" y="542" class="panel">D</text><text x="548" y="580" class="ct" fill="#173a5e">Independent recurrent learner</text><text x="548" y="618" class="body">SLM coordinates substantially improve policy readout</text><text x="548" y="652" class="body">same coordinates describe a flexible learned policy</text><text x="50" y="972" class="foot">Tap to open the full quantitative figure</text></svg>