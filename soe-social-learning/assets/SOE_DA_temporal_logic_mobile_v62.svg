<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><style>
.title{font:700 38px Arial;fill:#173a5e}.sub{font:400 24px Arial;fill:#657286}.panel{font:700 24px Arial;fill:#162131}.ct{font:700 27px Arial}.body{font:400 22px Arial;fill:#52677a}.foot{font:400 20px Arial;fill:#7b8797}
</style><rect width="1000" height="1000" fill="#fff"/><text x="50" y="62" class="title">VTA follows the episode timeline</text><text x="50" y="98" class="sub">A single RPE explains only the post-outcome part</text><rect x="50" y="140" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="182" class="panel">A</text><text x="78" y="220" class="ct" fill="#b9232f">Early</text><text x="78" y="258" class="body">pre-outcome sampling-policy signal</text><text x="78" y="292" class="body">Q/RPE is near zero here</text><rect x="520" y="140" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="548" y="182" class="panel">B</text><text x="548" y="220" class="ct" fill="#b9232f">Middle</text><text x="548" y="258" class="body">learner-linked APE appears before outcome</text><text x="548" y="292" class="body">survives conditioning on Q / choice-kernel alternatives</text><rect x="50" y="500" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="542" class="panel">C</text><text x="78" y="580" class="ct" fill="#555">Post</text><text x="78" y="618" class="body">SLM RPE / social-credit update are positive</text><text x="78" y="652" class="body">Q/RPE also works at outcome</text><rect x="520" y="500" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="548" y="542" class="panel">D</text><text x="548" y="580" class="ct" fill="#173a5e">Adjudication</text><text x="548" y="618" class="body">SLM is positive on all three prespecified axes</text><text x="548" y="652" class="body">flexible models do not reproduce the same temporal sequence</text><text x="50" y="972" class="foot">Tap to open the full quantitative figure</text></svg>