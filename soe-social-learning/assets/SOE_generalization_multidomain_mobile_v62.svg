.title{font:700 38px Arial;fill:#173a5e}.sub{font:400 24px Arial;fill:#657286}.panel{font:700 24px Arial;fill:#162131}.ct{font:700 27px Arial}.body{font:400 22px Arial;fill:#52677a}.foot{font:400 20px Arial;fill:#7b8797}
</style><rect width="1000" height="1000" fill="#fff"/><text x="50" y="62" class="title">Behavior after SOE training</text><text x="50" y="98" class="sub">The same mice later enter two new domains</text><rect x="50" y="150" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="192" class="panel">A</text><text x="78" y="230" class="ct" fill="#173a5e">Observational fear</text><text x="78" y="268" class="body">prior SOE experience changes first-day fear organization</text><text x="78" y="302" class="body">shock-locked reaction becomes a measurable follow-up phenotype</text><rect x="50" y="390" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="432" class="panel">B</text><text x="78" y="470" class="ct" fill="#173a5e">Novel food</text><text x="78" y="508" class="body">prior social experience changes novel-food engagement</text><text x="78" y="542" class="body">initiation latency is the most informative endpoint</text><rect x="50" y="630" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="672" class="panel">C</text><text x="78" y="710" class="ct" fill="#b9232f">Next question</text><text x="78" y="748" class="body">behavioral change alone does not identify which SOE computation transfers</text><text x="78" y="782" class="body">latent mapping tests credit and APE separately</text><text x="50" y="972" class="foot">Tap to open the full quantitative figure</text></svg>