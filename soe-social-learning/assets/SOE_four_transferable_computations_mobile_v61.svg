<style>.title{font:700 38px Arial;fill:#173a5e}.sub{font:400 24px Arial;fill:#657286}.panel{font:700 24px Arial;fill:#162131}.ct{font:700 27px Arial}.body{font:400 22px Arial;fill:#52677a}.foot{font:400 20px Arial;fill:#7b8797}</style>
<rect width="1000" height="1000" fill="#fff"/><text x="50" y="62" class="title">Four transferable computations</text><text x="50" y="98" class="sub">The cross-dataset claim is computation-level, with evidence tiers explicit</text><rect x="50" y="140" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="182" class="panel">A</text><text x="78" y="220" class="ct" fill="#b9232f">Source-tagged credit</text><text x="78" y="258" class="body">who generated the information matters</text><text x="78" y="292" class="body">rat/macaque component support</text><rect x="520" y="140" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="548" y="182" class="panel">B</text><text x="548" y="220" class="ct" fill="#173a5e">State-gated value</text><text x="548" y="258" class="body">social evidence value depends on current state</text><text x="548" y="292" class="body">SOE + external task convergence</text><rect x="50" y="500" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="542" class="panel">C</text><text x="78" y="580" class="ct" fill="#b9232f">Multiscale state</text><text x="78" y="618" class="body">seconds / minutes / longer history</text><text x="78" y="652" class="body">strong Human/Rat comparator support</text><rect x="520" y="500" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="548" y="542" class="panel">D</text><text x="548" y="580" class="ct" fill="#173a5e">Sampling → action</text><text x="548" y="618" class="body">sample information, then convert it into choice</text><text x="548" y="652" class="body">SOE direct; external architectural analogues</text><text x="50" y="972" class="foot">Tap to open the full quantitative figure</text></svg>