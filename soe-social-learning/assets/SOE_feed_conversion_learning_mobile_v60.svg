<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
<style>.title{font:700 38px Arial;fill:#173a5e}.sub{font:400 24px Arial;fill:#657286}.panel{font:700 24px Arial;fill:#162131}.ct{font:700 27px Arial}.body{font:400 22px Arial;fill:#52677a}.foot{font:400 20px Arial;fill:#7b8797}</style>
<rect width="1000" height="1000" fill="#fff"/>
<text x="50" y="62" class="title">Observed content → own feeding</text>
<text x="50" y="98" class="sub">Same learner cohort, increasingly strict controls</text>
<rect x="50" y="140" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="182" class="panel">A</text><text x="78" y="220" class="ct" fill="#b9232f">Raw content effect</text><text x="78" y="258" class="body">dem-feed vs no-dem-feed</text><text x="78" y="292" class="body">Feed hazard +7.54 pp; P=.0377</text><rect x="520" y="140" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="548" y="182" class="panel">B</text><text x="548" y="220" class="ct" fill="#173a5e">Frozen-state control</text><text x="548" y="258" class="body">after self + current-social residualization</text><text x="548" y="292" class="body">+6.09 pp; P=.0445</text><rect x="50" y="500" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="542" class="panel">C</text><text x="78" y="580" class="ct" fill="#b9232f">Session progression</text><text x="78" y="618" class="body">raw contrast grows first→second</text><text x="78" y="652" class="body">+7.74 pp; 13/17; P=.0448</text><rect x="520" y="500" width="430" height="320" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="548" y="542" class="panel">D</text><text x="548" y="580" class="ct" fill="#555">Progression boundary</text><text x="548" y="618" class="body">residualized shift stays positive</text><text x="548" y="652" class="body">P=.243: direction consistent, not significant</text>
