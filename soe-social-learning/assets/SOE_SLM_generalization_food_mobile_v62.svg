</style><rect width="1000" height="1000" fill="#fff"/><text x="50" y="62" class="title">Social credit forecasts novel-food initiation</text><text x="50" y="98" class="sub">A nested held-out test asks whether the SLM credit axis adds value</text><rect x="50" y="150" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="192" class="panel">A</text><text x="78" y="230" class="ct" fill="#173a5e">Predictor</text><text x="78" y="268" class="body">use the SOE social-credit family measured before the food assay</text><text x="78" y="302" class="body">predict later novel-food initiation</text><rect x="50" y="390" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="432" class="panel">B</text><text x="78" y="470" class="ct" fill="#b9232f">Comparator</text><text x="78" y="508" class="body">compare with matched simple SOE behavior under leave-one-mouse-out</text><text x="78" y="542" class="body">credit family lowers held-out error in 6/6 mice</text><rect x="50" y="630" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="672" class="panel">C</text><text x="78" y="710" class="ct" fill="#173a5e">Meaning</text><text x="78" y="748" class="body">the clearest incremental generalization currently lies in action initiation</text><text x="78" y="782" class="body">supports transfer of a social-credit phenotype</text><text x="50" y="972" class="foot">Tap to open the full quantitative figure</text></svg>