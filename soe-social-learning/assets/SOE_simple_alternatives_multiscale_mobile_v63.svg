<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><style>.title{font:700 38px Arial;fill:#173a5e}.sub{font:400 24px Arial;fill:#657286}.panel{font:700 24px Arial;fill:#162131}.ct{font:700 27px Arial}.body{font:400 22px Arial;fill:#52677a}.foot{font:400 20px Arial;fill:#7b8797}</style><rect width="1000" height="1000" fill="#fff"/><text x="50" y="62" class="title">Why memory needs multiscale structure</text><text x="50" y="98" class="sub">Simpler alternatives leave systematic held-animal information unexplained</text><rect x="50" y="150" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="192" class="panel">A</text><text x="78" y="230" class="ct" fill="#555">Scalar RW</text><text x="78" y="268" class="body">captures a single running value</text><text x="78" y="302" class="body">misses immediate switching + longer recent history</text><rect x="50" y="390" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="432" class="panel">B</text><text x="78" y="470" class="ct" fill="#555">Uncertainty / single-trace models</text><text x="78" y="508" class="body">capture only one aspect of state</text><text x="78" y="542" class="body">single exponential eligibility cannot span all observed timescales</text><rect x="50" y="630" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="672" class="panel">C</text><text x="78" y="710" class="ct" fill="#b9232f">Multiscale state</text><text x="78" y="748" class="body">combines next-decision switching, minutes of history and cross-day prior</text><text x="78" y="782" class="body">matches the behavioral structure used by the default SLM</text><text x="50" y="972" class="foot">Tap to open the full quantitative figure</text></svg>