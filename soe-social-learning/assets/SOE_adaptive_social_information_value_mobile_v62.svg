<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><style>
.title{font:700 38px Arial;fill:#173a5e}.sub{font:400 24px Arial;fill:#657286}.panel{font:700 24px Arial;fill:#162131}.ct{font:700 27px Arial}.body{font:400 22px Arial;fill:#52677a}.foot{font:400 20px Arial;fill:#7b8797}
</style><rect width="1000" height="1000" fill="#fff"/><text x="50" y="62" class="title">State-gated information value</text><text x="50" y="98" class="sub">How much does social state improve prediction of the next choice?</text><rect x="50" y="150" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="192" class="panel">A</text><text x="78" y="230" class="ct" fill="#555">Baseline</text><text x="78" y="268" class="body">observer-only state predicts part of the next decision</text><text x="78" y="302" class="body">full social state adds held-out information</text><rect x="50" y="390" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="432" class="panel">B</text><text x="78" y="470" class="ct" fill="#b9232f">Learning dependence</text><text x="78" y="508" class="body">the incremental value changes with training</text><text x="78" y="542" class="body">social evidence is used differently as the learner improves</text><rect x="50" y="630" width="900" height="210" rx="22" fill="#fff" stroke="#dfe5ec" stroke-width="2"/><text x="78" y="672" class="panel">C</text><text x="78" y="710" class="ct" fill="#173a5e">State gating</text><text x="78" y="748" class="body">external social evidence matters most in specific self-states</text><text x="78" y="782" class="body">current state determines how useful new social evidence can be</text><text x="50" y="972" class="foot">Tap to open the full quantitative figure</text></svg>